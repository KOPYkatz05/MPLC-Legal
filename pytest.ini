[pytest]
testpaths =
    tests
python_files =
    test_*.py
    *_test.py
python_classes =
    Test*
python_functions =
    test_*
addopts =
    --strict-markers
    --tb=short
norecursedirs =
    .git
    .venv
    venv
    env
    ENV
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    logs
    tmp*
markers =
    integration: tests that touch external services, native OCR libraries, or local model files
    regression: tests that protect previously fixed behavior
    slow: tests that are intentionally slower than the default unit suite
